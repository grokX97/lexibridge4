name: Polish corpus quality wording

on:
  push:
    paths:
      - .github/workflows/polish-corpus-copy.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make corpus claims precise
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '正在核验四语语义对齐。词卡会区分词网自然例句与结构化语境，不把自动补全冒充人工审校。',
              '词义卡按需检索 Tatoeba 人类自然语料，只显示可追溯的搭配与例句；证据不足时明确留空，不再用模板句补位。'
          )
          s = s.replace('常用搭配 / 相关表达', '真实语料搭配 / 相关表达')
          s = s.replace(
              '严格版词库只接受同一 WordNet/ILI 概念下同时存在中、英、德、法对应词的卡片；词网没有自然例句时会显示明确标注的结构化语境。',
              '词义采用同一 WordNet/ILI 概念的中英德法对齐；搭配和例句打开词卡后从 Tatoeba 检索并缓存。没有足够证据时直接标注缺失，不生成模板内容。'
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/polish-corpus-copy.yml
          git commit -m 'Make corpus quality claims precise'
          git push
