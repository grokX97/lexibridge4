name: Assemble LexiBridge corpus app v8

on:
  push:
    paths:
      - app_gzparts/READY

permissions:
  contents: write

concurrency:
  group: lexibridge-assemble-v8
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate app
        run: |
          cat app_gzparts/gz-*.b64 | tr -d '\n' | base64 --decode | gunzip > app.js
          node --check app.js
          grep -q "Tatoeba 人类自然语料" app.js
          grep -q "没有用模板短语补位" app.js
          grep -q "if (!match) return -Infinity" app.js

      - name: Refresh page shell and offline cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('?v=6', '?v=8')
          s = s.replace('href="styles.css"', 'href="styles.css?v=8"')
          s = s.replace(
              '每张卡均显示四语词义、四语搭配/用法框架和四语例句；语料例句、人工精修与结构化补全会明确标注，不把自动内容伪装成人工校订。',
              '词义卡打开后会按需检索 Tatoeba 人类自然语料；只显示有证据的短语与例句，缺失时明确标注，不再用模板句或机器拼接内容补位。'
          )
          p.write_text(s, encoding='utf-8')
          PY
          cat > sw.js <<'EOF'
          const CACHE='lexibridge4-v8';
          const CORE=['./','./index.html','./styles.css?v=8','./app.js?v=8','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            if(e.request.method!=='GET')return;
            const u=new URL(e.request.url);if(u.origin!==location.origin)return;
            e.respondWith(fetch(e.request).then(resp=>{const cp=resp.clone();caches.open(CACHE).then(c=>c.put(e.request,cp));return resp;}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))));
          });
          EOF

      - name: Commit release and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js
          git rm -r app_parts app_gzparts
          git rm .github/workflows/assemble-app-v8.yml
          git commit -m 'Ship evidence-based natural corpus vocabulary content'
          git push
