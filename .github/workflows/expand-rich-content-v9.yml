name: Expand LexiBridge rich content v9

on:
  push:
    paths:
      - .release-v9-expand

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove low caps and clarify repeatable expansion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("return out.slice(0,kind==='collocations'?30:kind==='examples'?20:20);", "return out.slice(0,kind==='collocations'?240:kind==='examples'?120:80);")
          s=s.replace("pack[field]=old.slice(0,type==='collocations'?30:20);", "pack[field]=old.slice(0,type==='collocations'?240:120);")
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('id="expandCollocationsBtn">继续扩展</button>', 'id="expandCollocationsBtn">继续扩展（可重复）</button>')
          s=s.replace('id="expandExamplesBtn">更多例句</button>', 'id="expandExamplesBtn">继续生成（可重复）</button>')
          s=s.replace('AI 按词生成并缓存：三语词形、词族、同义/反义词、核心搭配和平行例句。', 'AI 按词生成并缓存：三语词形、词族、同义/反义词、核心搭配和平行例句；搭配和例句可反复扩展并自动去重。')
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          grep -q "collocations'?240" app.js
          grep -q '继续扩展（可重复）' index.html

      - name: Commit and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git rm .release-v9-expand .github/workflows/expand-rich-content-v9.yml
          git commit -m 'Allow repeatable high-value collocation and example expansion'
          git push
