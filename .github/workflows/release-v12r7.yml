name: LexiBridge v12r7 final exhaustive qualification
on:
  push:
    paths:
      - .release-v12-r7
permissions:
  contents: write
concurrency:
  group: lexibridge-v12r7-release
  cancel-in-progress: true
jobs:
  qualify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply complete repair stack
        run: |
          python scripts/patch_v12.py
          python scripts/patch_v12b.py
          python scripts/patch_v12c.py
          python scripts/patch_v12d.py
          python scripts/patch_v12e.py
          python scripts/patch_v12f.py
          python scripts/patch_e2e_v12.py
          python scripts/patch_e2e_v12c.py
          python scripts/patch_e2e_v12d.py
          python scripts/patch_e2e_v12e.py
          python scripts/patch_e2e_v12f.py
          node --check app.js
      - name: Static global audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          html=Path('index.html').read_text(encoding='utf-8');js=Path('app.js').read_text(encoding='utf-8')
          ids=set(re.findall(r'id="([^"]+)"',html));refs=set(re.findall(r"\$\('#([^']+)'\)",js));missing=sorted(refs-ids-{'directLookupBtn','retryAnalysis'})
          assert not missing,missing
          assert '这一语言我原本就会' not in html and '>这个词我认识<' in html
          assert '<option value="partial">部分语言已掌握</option>' in html
          for q in ['studyEpoch','detailEpoch','searchEpoch','currentTask!==task','detailCard!==card','analysisFlights','packFlights','function pendingTasks','AI 识别词形 / 查询','putAnalysis(out.word,out)','clearSenseBusy();const selected=',"$('#loadSenseBtn').onclick=()=>loadSensePack();"]:assert q in js,q
          assert 'puter' not in js.lower() and 'puter' not in html.lower()
          assert not re.search(r'(?i)(sk-[A-Za-z0-9_-]{20,}|DEEPSEEK_API_KEY\s*=\s*["\'][^"\']+)',js+html)
          rows=[]
          for p in sorted(Path('vocab').glob('part-*.js')):
              m=re.search(r'push\(\.\.\.(\[.*\])\);?$',p.read_text(encoding='utf-8').strip(),re.S);assert m,p;rows.extend(json.loads(m.group(1)))
          heads=[str(r[0]).lower() for r in rows]
          assert len(rows)==10000 and len(set(heads))==10000 and 'lundi' not in heads
          assert all(re.fullmatch(r"[a-z][a-z'-]{1,34}",w) for w in heads)
          Path('QA_STATIC_V12.json').write_text(json.dumps({'nodeSyntax':'PASS','missingDomIds':missing,'cards':len(rows),'uniqueHeads':len(set(heads)),'lundiEnglishHeadword':False,'knownWording':'这个词我认识','secretLeakCheck':'PASS','puterRemoved':True,'asyncRaceGuards':'PASS','requestDeduplication':'PASS','unfinishedLanguageRecovery':'PASS','threeLanguageMastery':'PASS','senseBusyReset':'PASS','eventHandlerGuard':'PASS','canonicalLookup':'PASS'},ensure_ascii=False,indent=2)+'\n')
          print('STATIC_OK')
          PY
      - name: Prepare system Chrome
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then npx playwright install chromium --with-deps; CHROME_PATH="$HOME/.cache/ms-playwright/chromium-1187/chrome-linux/chrome"; fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Candidate browser lifecycle regression
        run: |
          python3 -m http.server 4173 >/tmp/lb4-http.log 2>&1 &
          sleep 2
          node qa/e2e_v12.mjs > QA_BROWSER_V12.json
          cat QA_BROWSER_V12.json
      - name: Production DeepSeek safety quality and canonicalization regression
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,pathlib
          H='https://lexibridge4-deepseek.vercel.app/api/health';A='https://lexibridge4-deepseek.vercel.app/api/lexi'
          def req(url,data=None,origin=None,method=None,timeout=180):
              h={'Accept':'application/json'}
              if data is not None:h['Content-Type']='application/json'
              if origin:h['Origin']=origin
              r=urllib.request.Request(url,data=json.dumps(data).encode() if data is not None else None,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:return x.status,json.loads(x.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try:b=json.loads(raw)
                  except:b={'raw':raw}
                  return e.code,b
          hs,h=req(H);assert hs==200 and h.get('ok') and h.get('configured');assert {'deepseek-v4-flash','deepseek-v4-pro'}<=set(h.get('models',[]))
          gs,_=req(A,method='GET');assert gs==405
          os,_=req(A,{'action':'analyze','word':'extempore'},origin='https://evil.example');assert os==403
          es,e=req(A,{'action':'analyze','word':'extempore','base':{'zhHint':'即席的'}},origin='https://grokx97.github.io');assert es==200 and e.get('ok');ss=(e.get('result') or {}).get('senses') or [];assert ss;z=' '.join(x.get('zhDefinition','')+' '+x.get('zhExplanation','') for x in ss);assert any(k in z for k in ['即兴','没有事先准备','临时']),z
          cs,c=req(A,{'action':'analyze','word':'contaminated','base':{}},origin='https://grokx97.github.io');assert cs==200 and c.get('ok');lemma=str((c.get('result') or {}).get('word','')).lower();assert lemma=='contaminate',lemma
          pathlib.Path('QA_BACKEND_V12.json').write_text(json.dumps({'health':h,'getLexiStatus':gs,'badOriginStatus':os,'extemporeNaturalChinese':True,'extemporeSenses':len(ss),'contaminatedCanonicalLemma':lemma},ensure_ascii=False,indent=2)+'\n')
          print('BACKEND_OK')
          PY
      - name: Promote only qualified candidate
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .release-v12 .release-v12-r3 .release-v12-r4 .release-v12-r5 .release-v12-r6 .release-v12-r7 scripts/patch_v12.py scripts/patch_v12b.py scripts/patch_v12c.py scripts/patch_v12d.py scripts/patch_v12e.py scripts/patch_v12f.py scripts/patch_e2e_v12.py scripts/patch_e2e_v12c.py scripts/patch_e2e_v12d.py scripts/patch_e2e_v12e.py scripts/patch_e2e_v12f.py .github/workflows/release-v12.yml .github/workflows/release-v12r3.yml .github/workflows/release-v12r4.yml .github/workflows/release-v12r5.yml .github/workflows/release-v12r6.yml .github/workflows/release-v12r7.yml
          git add app.js index.html styles.css sw.js qa/e2e_v12.mjs QA_STATIC_V12.json QA_BROWSER_V12.json QA_BACKEND_V12.json
          git commit -m 'Ship lifecycle-safe multilingual study v12 after exhaustive regression'
          git push
      - name: Wait for Pages v12
        run: |
          python - <<'PY'
          import urllib.request,time
          u='https://grokx97.github.io/lexibridge4/?qa=v12r7-live'
          for _ in range(60):
              try:
                  s=urllib.request.urlopen(u,timeout=20).read().decode()
                  if 'app.js?v=12' in s and '这个词我认识' in s:print('PAGES_V12_VISIBLE');break
              except Exception:pass
              time.sleep(5)
          else:raise SystemExit('Pages v12 not visible')
          PY
      - name: Published-site browser lifecycle regression
        run: |
          BASE_URL='https://grokx97.github.io/lexibridge4/?qa=v12r7-live' node qa/e2e_v12.mjs > ONLINE_BROWSER_V12.json
          cat ONLINE_BROWSER_V12.json
      - name: Freeze live QA evidence
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          b=json.loads(pathlib.Path('ONLINE_BROWSER_V12.json').read_text());pathlib.Path('ONLINE_QA_V12.json').write_text(json.dumps({'testedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'onlineV12':True,'browser':b},ensure_ascii=False,indent=2)+'\n')
          PY
          git add ONLINE_BROWSER_V12.json ONLINE_QA_V12.json
          git commit -m 'Verify published LexiBridge v12 lifecycle end to end'
          git push
