name: LexiBridge v12 global repair and regression
on:
  push:
    paths:
      - .release-v12
permissions:
  contents: write
concurrency:
  group: lexibridge-v12-release
  cancel-in-progress: true
jobs:
  repair-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply race state and canonical-search repair
        run: |
          python scripts/patch_v12.py
          python scripts/patch_v12b.py
          python scripts/patch_e2e_v12.py
          node --check app.js

      - name: Static DOM corpus and security audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set(re.findall(r"\$\('#([^']+)'\)",js))
          dynamic={'directLookupBtn','retryAnalysis'}
          missing=sorted(refs-ids-dynamic)
          assert not missing,missing
          assert '这一语言我原本就会' not in html
          assert '>这个词我认识<' in html
          assert 'studyEpoch' in js and 'detailEpoch' in js and 'searchEpoch' in js
          assert 'currentTask!==task' in js and 'detailCard!==card' in js
          assert 'AI 识别词形 / 查询' in js
          assert 'await putAnalysis(a.word,a)' in js
          assert 'puter' not in js.lower() and 'puter' not in html.lower()
          assert not re.search(r'(?i)(sk-[A-Za-z0-9_-]{20,}|DEEPSEEK_API_KEY\s*=\s*["\'][^"\']+)',js+html)
          rows=[]
          for p in sorted(Path('vocab').glob('part-*.js')):
              t=p.read_text(encoding='utf-8').strip()
              m=re.search(r'push\(\.\.\.(\[.*\])\);?$',t,re.S)
              assert m,p
              rows.extend(json.loads(m.group(1)))
          heads=[str(r[0]).lower() for r in rows]
          assert len(rows)==10000,len(rows)
          assert len(set(heads))==10000
          assert 'lundi' not in heads, 'French lundi leaked into English headword corpus'
          assert all(re.fullmatch(r"[a-z][a-z'-]{1,34}",w) for w in heads)
          Path('QA_STATIC_V12.json').write_text(json.dumps({'nodeSyntax':'PASS','domRefs':len(refs),'missingDomIds':missing,'cards':len(rows),'uniqueHeads':len(set(heads)),'lundiEnglishHeadword':False,'puterRemoved':True,'secretLeakCheck':'PASS','asyncRaceGuards':'PASS','canonicalLookupUI':'PASS'},indent=2)+'\n')
          print('STATIC_V12_OK')
          PY

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Browser regression on candidate
        run: |
          python3 -m http.server 4173 >/tmp/lb4-http.log 2>&1 &
          echo $! >/tmp/lb4-http.pid
          sleep 2
          node qa/e2e_v12.mjs > QA_BROWSER_V12.json
          cat QA_BROWSER_V12.json

      - name: Live DeepSeek proxy smoke security and lemma checks
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,pathlib
          H='https://lexibridge4-deepseek.vercel.app/api/health'
          A='https://lexibridge4-deepseek.vercel.app/api/lexi'
          def req(url,data=None,origin=None,method=None,timeout=180):
              headers={'Accept':'application/json'}
              if data is not None: headers['Content-Type']='application/json'
              if origin: headers['Origin']=origin
              r=urllib.request.Request(url,data=(json.dumps(data).encode() if data is not None else None),headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as x:return x.status,json.loads(x.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  raw=e.read().decode() or '{}'
                  try: body=json.loads(raw)
                  except: body={'raw':raw}
                  return e.code,body
          hs,h=req(H)
          assert hs==200 and h.get('ok') and h.get('configured')
          assert 'deepseek-v4-flash' in h.get('models',[]) and 'deepseek-v4-pro' in h.get('models',[])
          gs,g=req(A,method='GET')
          assert gs==405
          os,o=req(A,{'action':'analyze','word':'extempore'},origin='https://evil.example')
          assert os==403
          s,d=req(A,{'action':'analyze','word':'extempore','base':{'zhHint':'即席的'}},origin='https://grokx97.github.io')
          assert s==200 and d.get('ok')
          senses=(d.get('result') or {}).get('senses') or []
          assert senses
          z=' '.join((x.get('zhDefinition','')+' '+x.get('zhExplanation','')) for x in senses)
          assert any(k in z for k in ['即兴','没有事先准备','临时']),z
          cs,cd=req(A,{'action':'analyze','word':'contaminated','base':{}},origin='https://grokx97.github.io')
          assert cs==200 and cd.get('ok'),(cs,cd)
          assert str((cd.get('result') or {}).get('word','')).lower()=='contaminate',cd
          pathlib.Path('QA_BACKEND_V12.json').write_text(json.dumps({'health':h,'getLexiStatus':gs,'badOriginStatus':os,'extemporeStatus':s,'extemporeSenseCount':len(senses),'extemporeChineseNatural':True,'contaminatedStatus':cs,'contaminatedCanonicalLemma':(cd.get('result') or {}).get('word')},ensure_ascii=False,indent=2)+'\n')
          print('BACKEND_V12_OK')
          PY

      - name: Commit v12 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .release-v12
          git rm -f scripts/patch_v12.py scripts/patch_v12b.py scripts/patch_e2e_v12.py .github/workflows/release-v12.yml
          git add app.js index.html styles.css sw.js qa/e2e_v12.mjs QA_STATIC_V12.json QA_BROWSER_V12.json QA_BACKEND_V12.json
          git commit -m 'Ship stale-safe multilingual study v12 with global regression coverage'
          git push

      - name: Wait for GitHub Pages v12
        run: |
          python - <<'PY'
          import urllib.request,time
          u='https://grokx97.github.io/lexibridge4/?qa=v12-live'
          ok=False
          for i in range(60):
              try:
                  s=urllib.request.urlopen(u,timeout=20).read().decode()
                  if 'app.js?v=12' in s and '这个词我认识' in s:
                      ok=True;break
              except Exception: pass
              time.sleep(5)
          assert ok,'GitHub Pages did not publish v12 in time'
          print('PAGES_V12_VISIBLE')
          PY

      - name: Browser regression against published site
        run: |
          BASE_URL='https://grokx97.github.io/lexibridge4/?qa=v12-live' node qa/e2e_v12.mjs > ONLINE_BROWSER_V12.json
          cat ONLINE_BROWSER_V12.json

      - name: Commit live verification
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          b=json.loads(pathlib.Path('ONLINE_BROWSER_V12.json').read_text())
          out={'testedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'onlineV12':True,'browser':b}
          pathlib.Path('ONLINE_QA_V12.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git add ONLINE_BROWSER_V12.json ONLINE_QA_V12.json
          git commit -m 'Verify published LexiBridge v12 end to end'
          git push
