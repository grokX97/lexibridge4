name: Finalize LexiBridge AI v9

on:
  push:
    paths:
      - .release-v9-ai-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden model discovery and non-blocking Puter loading
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("aiModel:'anthropic/claude-sonnet-5'", "aiModel:'claude-sonnet-4-6'")
          s = s.replace("const cached=await loadPack(c,{cloud:false});", "const cached=await loadPack(c,{cloud:true});")
          old = '''async function callAi(prompt,model=state.settings.aiModel){
            await ensureAiAuth();
            const res=await window.puter.ai.chat(prompt,{model,temperature:0.15,max_tokens:12000});
            return extractResponseText(res);
          }
          '''
          new = '''let modelCatalogPromise = null;
          async function resolveAiModel(preferred){
            const clean=String(preferred||'').replace(/^anthropic\\//,'');
            try{
              modelCatalogPromise ||= window.puter.ai.listModels();
              const models=await modelCatalogPromise;
              const ids=new Set();
              for(const m of Array.isArray(models)?models:[]){
                if(m?.id)ids.add(String(m.id));
                for(const a of Array.isArray(m?.aliases)?m.aliases:[])ids.add(String(a));
              }
              for(const id of [preferred,clean,'claude-sonnet-4-6','gpt-5.5','gpt-5.4','gpt-5-nano']){
                if(id&&ids.has(id))return id;
              }
              const available=[...ids];
              return available.find(x=>/claude.*sonnet/i.test(x))
                ||available.find(x=>/^gpt-5(?:\\.|-|$)/i.test(x))
                ||available[0]
                ||clean
                ||undefined;
            }catch{
              return clean||undefined;
            }
          }
          async function callAi(prompt,model=state.settings.aiModel){
            await ensureAiAuth();
            const resolved=await resolveAiModel(model);
            const options={temperature:0.15,max_tokens:12000};
            if(resolved)options.model=resolved;
            const res=await window.puter.ai.chat(prompt,options);
            return extractResponseText(res);
          }
          '''
          if old not in s:
              raise SystemExit('Expected callAi block not found')
          p.write_text(s.replace(old,new), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="https://js.puter.com/v2/"></script>', '<script defer src="https://js.puter.com/v2/"></script>')
          s = s.replace(
              '<option value="anthropic/claude-sonnet-5">Claude Sonnet 5（最高质量）</option><option value="anthropic/claude-sonnet-4-6">Claude Sonnet 4.6（稳定）</option><option value="anthropic/claude-haiku-4-5">Claude Haiku 4.5（节省额度）</option>',
              '<option value="claude-sonnet-4-6">Claude Sonnet 4.6（推荐）</option><option value="gpt-5.5">GPT-5.5（高质量）</option><option value="gpt-5.4">GPT-5.4（稳定）</option>'
          )
          p.write_text(s, encoding='utf-8')
          PY
          node --check app.js
          grep -q 'resolveAiModel' app.js
          grep -q 'script defer src="https://js.puter.com/v2/"' index.html
          grep -q 'Claude Sonnet 4.6（推荐）' index.html

      - name: Commit final release and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git rm .release-v9-ai-fix .github/workflows/finalize-ai-v9.yml
          git commit -m 'Finalize adaptive AI model discovery and offline-safe loading'
          git push
